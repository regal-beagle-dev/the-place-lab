[tools]
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = false }
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"

[tasks.sync]
description = "Install pinned tools and dependencies"
run = "uv sync"

[tasks.render]
description = "Regenerate build/ from the roster"
run = "uv run place render"

[tasks.check]
description = "Fail if build/ is stale"
run = "uv run place check"

[tasks.reservations]
description = "Addresses to reserve by hand in the Nokia app"
run = "uv run place reservations"

[tasks.bootstrap]
description = "First contact with a node; needs -K for the sudo password"
dir = "{{config_root}}/ansible"
run = "uv run ansible-playbook playbooks/bootstrap.yml"

[tasks.ping]
description = "Can Ansible reach every node?"
dir = "{{config_root}}/ansible"
run = "uv run ansible all -m ping"

[tasks.plan]
description = "Dry run: what would change on the fleet, and how"
depends = ["check"]
dir = "{{config_root}}/ansible"
run = "uv run ansible-playbook playbooks/site.yml --check --diff"

[tasks.converge]
description = "Apply the fleet definition; twice in a row must report zero changed"
depends = ["check"]
dir = "{{config_root}}/ansible"
run = "uv run ansible-playbook playbooks/site.yml"
