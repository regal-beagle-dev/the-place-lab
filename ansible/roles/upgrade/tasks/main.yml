---
- name: Upgrade every package
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    autoremove: true
    clean: true
  environment:
    NEEDRESTART_MODE: a

- name: Check whether the kernel or a core library changed
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: upgrade_reboot

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 600
    post_reboot_delay: 30
  when: upgrade_reboot.stat.exists

- name: Refuse to move on while a unit is failed
  ansible.builtin.command: systemctl --failed --no-legend
  register: upgrade_units
  changed_when: false
  failed_when: upgrade_units.stdout | trim | length > 0
