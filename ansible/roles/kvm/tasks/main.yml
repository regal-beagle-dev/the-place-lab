---
- name: Leave nodes that host nothing alone
  ansible.builtin.meta: end_host
  when: place_vms | default([]) | length == 0

- name: Carve the image volume
  ansible.builtin.command: "lvcreate -L {{ kvm_volume_size }} -n {{ kvm_volume }} {{ kvm_volume_group }}"
  args:
    creates: "/dev/{{ kvm_volume_group }}/{{ kvm_volume }}"
  when: kvm_volume_size

- name: Read the volume's filesystem
  ansible.builtin.command: "blkid -o value -s TYPE /dev/{{ kvm_volume_group }}/{{ kvm_volume }}"
  register: kvm_volume_fs
  changed_when: false
  failed_when: false
  check_mode: false
  when: kvm_volume_size

- name: Format the image volume
  ansible.builtin.command: "mkfs.ext4 -L {{ kvm_volume }} /dev/{{ kvm_volume_group }}/{{ kvm_volume }}"
  when: kvm_volume_size and kvm_volume_fs.stdout == ""
  changed_when: true

- name: Install the image mount
  ansible.builtin.template:
    src: images.mount.j2
    dest: "/etc/systemd/system/{{ kvm_mount_unit }}"
    mode: "0644"
  register: kvm_mount_file
  when: kvm_volume_size

- name: Mount the image volume
  ansible.builtin.systemd_service:
    name: "{{ kvm_mount_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when: kvm_volume_size and not (ansible_check_mode and kvm_mount_file is changed)

- name: Install the hypervisor
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - libvirt-daemon-system
      - libvirt-clients
      - virtinst
      - cloud-image-utils
      - qemu-utils
    state: present
    install_recommends: false
  register: kvm_packages

# The group arrives with the packages, which a dry run only pretends to install.
- name: Let the admin user drive libvirt
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: libvirt
    append: true
  when: not (ansible_check_mode and kvm_packages is changed)

- name: Create the image and seed directories
  ansible.builtin.file:
    path: "{{ kvm_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [cloud, seed]

# A machine trusts exactly the keys its hypervisor trusts.
- name: Read the keys the hypervisor trusts
  ansible.builtin.slurp:
    src: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: kvm_authorized_keys

- name: Build each machine
  ansible.builtin.include_tasks: vm.yml
  loop: "{{ place_vms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"
