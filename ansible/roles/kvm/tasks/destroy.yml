---
- name: Only the hypervisor that hosts {{ vm }} acts
  ansible.builtin.meta: end_host
  when: vm not in (place_vms | default([]) | map(attribute='name') | list)

- name: Stop {{ vm }}
  ansible.builtin.command: "virsh destroy {{ vm }}"
  failed_when: false
  changed_when: true

- name: Forget {{ vm }}
  ansible.builtin.command: "virsh undefine {{ vm }}"
  failed_when: false
  changed_when: true

- name: Forget its host key
  ansible.builtin.known_hosts:
    name: "{{ (place_vms | selectattr('name', 'eq', vm) | first).address }}"
    state: absent
  delegate_to: localhost
  become: false

- name: Remove its disk and seed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kvm_root }}/{{ vm }}.qcow2"
    - "{{ kvm_root }}/seed/{{ vm }}"
    - "{{ kvm_root }}/seed/{{ vm }}.iso"
