---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
