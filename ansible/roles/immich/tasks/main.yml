---
- name: Create the project directory
  ansible.builtin.file:
    path: "{{ immich_root }}"
    state: directory
    mode: "0755"

- name: Create the database directory
  ansible.builtin.file:
    path: "{{ immich_database }}"
    state: directory

- name: Install the compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ immich_root }}/docker-compose.yml"
    mode: "0644"
  notify: Restart immich

- name: Configure Immich
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_root }}/.env"
    group: docker
    mode: "0640"
  notify: Restart immich

- name: Install the Immich unit
  ansible.builtin.template:
    src: immich.service.j2
    dest: /etc/systemd/system/immich.service
    mode: "0644"
  notify: Restart immich

- name: Enable Immich
  ansible.builtin.systemd_service:
    name: immich
    enabled: true
    state: started
    daemon_reload: true
