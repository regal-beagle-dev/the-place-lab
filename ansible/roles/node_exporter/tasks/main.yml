---
- name: Install the disk health tools
  ansible.builtin.apt:
    name:
      - smartmontools
      - nvme-cli
    state: present

- name: Install node_exporter and its collectors
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors
    state: present

- name: Enable node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
