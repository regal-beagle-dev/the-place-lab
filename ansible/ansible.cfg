[defaults]
inventory             = ../build/hosts.yml
roles_path            = roles
interpreter_python    = auto_silent
result_format         = yaml
display_skipped_hosts = false

# Ubuntu 26.04 defaults sudo to sudo-rs, which wraps a -p prompt as
# "[sudo: <prompt>] Password:" instead of emitting it verbatim. Ansible matches
# with startswith, so it never sees the prompt and times out. The original sudo
# ships alongside it and prompts as expected.
[privilege_escalation]
become_exe = /usr/bin/sudo.ws

[ssh_connection]
pipelining = true
