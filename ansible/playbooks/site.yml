---
- name: Apply the fleet
  hosts: all
  become: true
  roles:
    - base
    - net
    - shell
    - tailscale
    - node_exporter

- name: Apply the storage node
  hosts: storage
  become: true
  roles:
    - storage
    - docker
    - immich
    - backup

- name: Apply the control plane
  hosts: control_plane
  become: true
  roles:
    - docker
    - proxy
    - monitoring
